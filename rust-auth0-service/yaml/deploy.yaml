apiVersion: apps/v1
kind: Deployment
metadata:
  name: rust-auth0-service
  namespace: auth0
spec:
  replicas: 2
  selector:
    matchLabels:
      app: rust-auth0-service
  template:
    metadata:
      labels:
        app: rust-auth0-service
    spec:
      containers:
      - name: rust-auth0-service
        image: tororomeshi/rust_auth0_service:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
        env:
          - name: GOOGLE_CLIENT_ID
            valueFrom:
              secretKeyRef:
                name: google-auth-secrets
                key: client_id
          - name: GOOGLE_CLIENT_SECRET
            valueFrom:
              secretKeyRef:
                name: google-auth-secrets
                key: client_secret
          - name: GOOGLE_REDIRECT_URI
            value: "https://auth.tororomeshi.net/auth/google/callback"
          - name: APP_BASE_URL
            value: "https://portal.tororomeshi.net"
          - name: ALLOWED_REDIRECT_ORIGINS
            value: "https://portal.tororomeshi.net"
          - name: ALLOWED_CORS_ORIGINS
            value: "https://portal.tororomeshi.net,https://auth.tororomeshi.net"
          - name: UNIAUTH_URL
            value: "http://uniauth:8081"
          - name: REDIS_URL
            value: "redis://rfrm-redisfailover:6379"
          - name: SESSION_SECRET_KEY
            valueFrom:
              secretKeyRef:
                name: session-secret
                key: SESSION_SECRET_KEY
