apiVersion: apps/v1
kind: Deployment
metadata:
  name: rust-auth0-service
  namespace: auth0
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rust-auth0-service
  template:
    metadata:
      labels:
        app: rust-auth0-service
    spec:
      containers:
      - name: rust-auth0-service
        image: docker.io/tororomeshi/rust_auth0_service@sha256:ef5213351a5f69e09d22be448b1ebacbaddb26e8264d12ef313046f82f2dccf2
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
        env:
          # google-auth-secrets / client_id
          - name: GOOGLE_CLIENT_ID
            valueFrom:
              secretKeyRef:
                name: google-auth-secrets
                key: client_id
          # google-auth-secrets / client_secret
          - name: GOOGLE_CLIENT_SECRET
            valueFrom:
              secretKeyRef:
                name: google-auth-secrets
                key: client_secret
          # 現在の本番値。流用時は差し替える
          - name: GOOGLE_REDIRECT_URI
            value: "https://auth.tororomeshi.net/auth/google/callback"
          # Auth foundation Redis connection
          - name: REDIS_URL
            value: "redis://rfrm-redisfailover:6379"
          # Auth foundation PostgreSQL connection
          - name: PGHOST
            value: "auth0-account-db"
          - name: PGPORT
            value: "5432"
          - name: PGDATABASE
            value: "auth0_accounts"
          - name: PGSSLMODE
            value: "require"
          - name: PGUSER
            valueFrom:
              secretKeyRef:
                name: auth0-app-user.auth0-account-db.credentials.postgresql.acid.zalan.do
                key: username
          - name: PGPASSWORD
            valueFrom:
              secretKeyRef:
                name: auth0-app-user.auth0-account-db.credentials.postgresql.acid.zalan.do
                key: password
