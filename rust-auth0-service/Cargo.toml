[package]
name = "rust-auth0-service"
version = "0.3.3"
edition = "2021"

[dependencies]
actix-web = "4.3"
actix-session = { version = "0.10.1", features = ["redis-session"] }
actix-cors = "0.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
oauth2 = "4.4"
reqwest = { version = "0.12", features = ["json"] }
dotenv = "0.15"
env_logger = "0.11"
log = "0.4"
rand = "0.8"
base64 = "0.22"
sha2 = "0.10"
subtle = "2.6"
sqlx = { version = "=0.8.6", default-features = false, features = ["postgres", "runtime-tokio"] }
redis = { version = "=0.26.1", default-features = false, features = ["tokio-comp", "script"] }
