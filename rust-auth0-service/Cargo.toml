[package]
name = "rust-auth0-service"
version = "0.3.3"
edition = "2021"

[dependencies]
actix-web = "4.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
jsonwebtoken = "9.3"
futures = "0.3"
oauth2 = "4.4"
url = "2.3"
reqwest = { version = "0.12", features = ["json"] }
env_logger = "0.11"
log = "0.4"
tokio = { version = "1", features = ["macros", "signal"] }