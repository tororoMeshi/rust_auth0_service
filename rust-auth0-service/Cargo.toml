[package]
name = "rust-auth0-service"
version = "0.3.3"
edition = "2021"

[dependencies]
actix-web = "4.3"
actix-session = { version = "0.7", features = ["redis-rs-session"] }
# actix-redis は今回は使用せず、actix-session 内の Redis 用ストレージを利用します
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
oauth2 = "4.4"
reqwest = { version = "0.12", features = ["json"] }
dotenv = "0.15"
env_logger = "0.11"
log = "0.4"
rand = "0.8"
