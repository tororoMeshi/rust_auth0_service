[package]
name = "portal_backend"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.0", features = ["full"] }
warp = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
cookie = "0.18"
chrono = { version = "0.4", features = ["serde"] }
rand = "0.8"
base64 = "0.22"
sha2 = "0.10"
subtle = "2.6"
url = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
