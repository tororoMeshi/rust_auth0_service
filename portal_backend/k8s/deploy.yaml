apiVersion: apps/v1
kind: Deployment
metadata:
  name: portal-backend-deployment
  labels:
    app: portal-backend
  namespace: auth0
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: portal-backend
  template:
    metadata:
      labels:
        app: portal-backend
    spec:
      containers:
        - image: docker.io/tororomeshi/portal-backend@sha256:bae955bbaed09feaff928b522732a9a502ceed51da7dc58640a37419edc67d0f
          name: portal-backend
          imagePullPolicy: Always
          env:
            - name: PORT
              value: "3000"
            - name: PORTAL_SERVICE_ID
              valueFrom:
                configMapKeyRef:
                  name: backend-config
                  key: PORTAL_SERVICE_ID
            - name: PORTAL_AUTH_FOUNDATION_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: backend-config
                  key: PORTAL_AUTH_FOUNDATION_BASE_URL
            - name: PORTAL_SERVICE_SECRET
              valueFrom:
                secretKeyRef:
                  name: portal-prod-service-secret
                  key: service_secret
            - name: RUST_LOG
              value: "info"
          ports:
            - containerPort: 3000
              name: http
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "100m"
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 5
