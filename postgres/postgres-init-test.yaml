apiVersion: v1
kind: Pod
metadata:
  name: postgres-init-test
  namespace: auth0
spec:
  containers:
  - name: init-sql
    image: postgres:17  # PostgreSQLクライアントイメージ
    command:
    - sleep
    - "3600"  # デバッグ用に長時間起動状態を維持
    env:
    - name: POSTGRES_HOST
      value: auth0-account-db  # データベースのホスト名
    - name: POSTGRES_USER
      valueFrom:
        secretKeyRef:
          name: tororomeshi.auth0-account-db.credentials.postgresql.acid.zalan.do
          key: username
    - name: POSTGRES_PASSWORD
      valueFrom:
        secretKeyRef:
          name: tororomeshi.auth0-account-db.credentials.postgresql.acid.zalan.do
          key: password
    volumeMounts:
    - name: init-sql-script
      mountPath: /mnt/scripts
      readOnly: true
  volumes:
  - name: init-sql-script
    configMap:
      name: postgres-init-sql
  restartPolicy: Never
