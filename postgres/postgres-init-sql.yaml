apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init-sql
  namespace: auth0
data:
  init.sql: |
    DO $$
    BEGIN
        IF NOT EXISTS (SELECT 1 FROM pg_database WHERE datname = 'auth0_accounts') THEN
            CREATE DATABASE auth0_accounts;
        END IF;
    END $$;

    \c auth0_accounts;

    CREATE TABLE IF NOT EXISTS users (
        id SERIAL PRIMARY KEY,
        email VARCHAR(255) UNIQUE NOT NULL,
        google_id VARCHAR(255) UNIQUE NOT NULL,
        name VARCHAR(255),
        icon_url TEXT,
        created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
    );

    CREATE INDEX IF NOT EXISTS idx_users_email ON users(email);
    CREATE INDEX IF NOT EXISTS idx_users_google_id ON users(google_id);

    INSERT INTO users (email, google_id, name)
    SELECT 'admin@example.com', 'google-admin-id', 'Administrator'
    WHERE NOT EXISTS (
        SELECT 1 FROM users WHERE email = 'admin@example.com'
    );

    -- もしまだユーザーが対象DBに接続権限を持っていない場合
    GRANT CONNECT ON DATABASE auth0_accounts TO auth0_app_user;
    GRANT USAGE ON SCHEMA public TO auth0_app_user;

    -- テーブルへの DML 権限 (SELECT, INSERT, UPDATE, DELETE) を付与
    GRANT SELECT, INSERT, UPDATE, DELETE ON TABLE public.users TO auth0_app_user;

    -- シーケンス (AUTO_INCREMENT) がある場合、USAGE 権限が必要
    GRANT USAGE ON SEQUENCE public.users_id_seq TO auth0_app_user;
