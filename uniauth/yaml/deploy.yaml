apiVersion: apps/v1
kind: Deployment
metadata:
  name: uniauth
  namespace: auth0
spec:
  replicas: 1
  selector:
    matchLabels:
      app: uniauth
  template:
    metadata:
      labels:
        app: uniauth
    spec:
      containers:
      - name: uniauth
        image: tororomeshi/uniauth:0.5.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8081
        env:
          # PostgreSQL Operator で作成された Service 名
          # kubectl get svc -n auth0 で確認した "auth0-account-db" を利用
        - name: POSTGRES_HOST
          value: auth0-account-db

          # Zalando Operator が作成した Secret を参照
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: auth0-app-user.auth0-account-db.credentials.postgresql.acid.zalan.do
              key: username
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: auth0-app-user.auth0-account-db.credentials.postgresql.acid.zalan.do
              key: password

          # DB名は固定 or 別の ConfigMap/Secret で管理するなどお好みで
        - name: DB_NAME
          value: auth0_accounts

          # uniauth-secrets / jwt_secret を JWT_SECRET 環境変数として注入
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: uniauth-secrets
              key: jwt_secret

          # RedisにアクセスするためのURL
        - name: REDIS_URL
          value: "redis://rfrm-redisfailover:6379"
          # 現在の本番値。流用時は差し替える
        - name: APP_BASE_URL
          value: "https://portal.tororomeshi.net"
          # 現在の本番値。流用時は差し替える
        - name: FRONTEND_ORIGIN
          value: "https://portal.tororomeshi.net"
